name: CI

on:
  push:
    branches:
      - main
      - release/**
  pull_request:
    branches:
      - main
      - release/**

jobs:
  swiftlint:
    name: SwiftLint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container:
      # Pinned tag + amd64 digest. Bump both together from ghcr.io/realm/swiftlint.
      image: ghcr.io/realm/swiftlint:0.65.0@sha256:d6dd2aefa68155198c07884b42a59fd2ca5ee70ac9a2683a6e83445235c326d6
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Lint
        run: swiftlint lint --strict --reporter github-actions-logging

  swift-test:
    name: Swift tests
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run Swift tests
        run: swift test

  npm-build:
    name: npm build (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24, 26]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install Node dependencies
        run: npm install

      - name: Build test fixtures
        run: npm run build

      - name: Verify committed fixtures are up to date
        run: git diff --exit-code Tests/SodTests/Fixtures/
