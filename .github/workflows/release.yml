name: Release

# After CI succeeds on main, tag the release and publish @sod/build to npm.
# Triggered by a `chore(release): X.Y.Z` commit on main (see CONTRIBUTING.md),
# or manually via workflow_dispatch.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: Semver to release (e.g. 0.2.0)
        required: true

permissions:
  contents: write
  id-token: write

jobs:
  qualify:
    name: Qualify release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      sha: ${{ steps.meta.outputs.sha }}
    steps:
      - name: Checkout release commit
        if: github.event_name == 'workflow_run'
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Resolve release target
        id: meta
        env:
          DISPATCH_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            version="$DISPATCH_VERSION"
            sha="${{ github.sha }}"
          else
            if [[ "${{ github.event.workflow_run.conclusion }}" != "success" ]]; then
              echo "CI did not succeed — skipping release."
              exit 0
            fi

            sha="${{ github.event.workflow_run.head_sha }}"
            message=$(git log -1 --format=%s)
            if [[ ! "$message" =~ ^chore\(release\):\ (.+)$ ]]; then
              echo "Commit is not a release commit — skipping."
              exit 0
            fi
            version="${BASH_REMATCH[1]}"
          fi

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid semver: $version"
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  tag:
    name: Tag release
    needs: qualify
    if: needs.qualify.outputs.version != ''
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.qualify.outputs.sha }}
          fetch-depth: 0

      - name: Create and push tag
        env:
          VERSION: ${{ needs.qualify.outputs.version }}
        run: |
          set -euo pipefail
          if git rev-parse "$VERSION" >/dev/null 2>&1; then
            echo "Tag $VERSION already exists."
            exit 0
          fi
          git tag "$VERSION"
          git push origin "$VERSION"

  github-release:
    name: GitHub Release
    needs: [qualify, tag]
    if: needs.qualify.outputs.version != ''
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.qualify.outputs.sha }}

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.qualify.outputs.version }}
        run: gh release create "$VERSION" --title "$VERSION" --generate-notes

  npm-publish:
    name: Publish @sod/build
    needs: [qualify, tag]
    if: needs.qualify.outputs.version != ''
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.qualify.outputs.sha }}

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org

      - name: Verify package version matches release
        env:
          VERSION: ${{ needs.qualify.outputs.version }}
        run: |
          set -euo pipefail
          pkg_version=$(node -p "require('./npm/package.json').version")
          if [[ "$pkg_version" != "$VERSION" ]]; then
            echo "npm/package.json version ($pkg_version) does not match release ($VERSION)."
            exit 1
          fi

      - name: Publish to npm
        working-directory: npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public
